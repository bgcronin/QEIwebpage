name: Build authorised QEI mirror

on:
  workflow_dispatch:
    inputs:
      commit_snapshot:
        description: Commit the generated static site back to this branch
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: qei-static-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install --yes wget

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Discover public QEI hosts
        run: python scripts/discover_hosts.py

      - name: Discover sitemap URLs
        run: python scripts/discover_urls.py

      - name: Mirror public pages and assets
        run: bash scripts/mirror.sh

      - name: Disable forms, transactions, and tracking
        run: python scripts/postprocess.py

      - name: Audit generated snapshot
        run: python scripts/audit.py

      - name: Upload reviewable snapshot
        uses: actions/upload-artifact@v4
        with:
          name: qei-static-mirror-${{ github.run_number }}
          path: |
            site/
            reports/
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated snapshot
        if: github.event_name == 'schedule' || inputs.commit_snapshot == true
        run: |
          git config user.name "qei-mirror-bot"
          git config user.email "qei-mirror-bot@users.noreply.github.com"
          git add -- site reports
          if git diff --cached --quiet; then
            echo "No mirror changes to commit."
          else
            git commit -m "chore: refresh authorised QEI static mirror [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
