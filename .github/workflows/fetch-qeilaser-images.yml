name: Fetch QEI Laser images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download images from the Squarespace CDN
        run: python src/fetch_qeilaser_images.py

      - name: Rebuild the website with the images
        run: |
          python src/build.py
          python src/check_links.py --strict

      - name: Commit images and rebuilt site
        run: |
          git config user.name "qei-website-bot"
          git config user.email "qei-website-bot@users.noreply.github.com"
          git add -- content/media/qei-laser web
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Add QEI Laser images from qeilaser.com.au and rebuild"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
